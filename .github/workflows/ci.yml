name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      neo4j-test:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: none
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check src tests eval
      - run: uv run ruff format --check src tests eval
      - run: uv run mypy src
      - run: uv run pytest
