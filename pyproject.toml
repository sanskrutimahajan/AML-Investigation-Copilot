[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-investigation-copilot"
version = "0.1.0"
description = "Evidence-grounded AML investigation copilot"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.40",
    "faker>=40.43.0",
    "fastapi>=0.115",
    "neo4j>=5.25",
    "openai>=1.55",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "scikit-learn>=1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]
markers = ["integration: needs the throwaway Neo4j test container (make test-integration)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
